name: Terraform CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  PROJECT_ID: resumai-platform
  WORKLOAD_IDENTITY_PROVIDER: projects/367288272676/locations/global/workloadIdentityPools/github-actions/providers/github
  TERRAFORM_PLAN_SERVICE_ACCOUNT: tf-plan-readonly@resumai-platform.iam.gserviceaccount.com

jobs:
  fmt-validate:
    name: Format and validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - global
          - envs/staging
          - envs/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        if: matrix.directory == 'global'
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  readonly-plan:
    name: Read-only plan (${{ matrix.stack }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: fmt-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: global
            directory: global
          - stack: staging
            directory: envs/staging
          - stack: prod
            directory: envs/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.TERRAFORM_PLAN_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Initialize remote state
        working-directory: ${{ matrix.directory }}
        run: terraform init -reconfigure -input=false

      - name: Require a clean read-only plan
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          set +e
          terraform plan \
            -json \
            -detailed-exitcode \
            -input=false \
            -lock=false \
            > "${RUNNER_TEMP}/${{ matrix.stack }}-plan.json"
          exit_code=$?
          set -e

          jq -c \
            'select(.type == "change_summary" or .type == "diagnostic")' \
            "${RUNNER_TEMP}/${{ matrix.stack }}-plan.json"

          exit "${exit_code}"
